<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Density Altitude Calculator</title>
    <style>
        body { 
            background: #0f172a; 
            color: #fff; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
            margin: 0;
        }
        .card { 
            background: #1e293b; 
            border: 1px solid #475569; 
            border-radius: 12px; 
            max-width: 480px; 
            width: 100%; 
            padding: 24px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        h2 { 
            text-align: center; 
            margin-top: 0;
            margin-bottom: 16px; 
            font-size: 1.35rem; 
            color: #f8fafc;
        }
        label { 
            font-size: 0.75rem; 
            color: #94a3b8; 
            display: block; 
            margin-top: 12px; 
            margin-bottom: 4px; 
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }
        input, button { 
            width: 100%; 
            padding: 12px; 
            border-radius: 6px; 
            border: 1px solid #475569; 
            box-sizing: border-box; 
        }
        input { 
            background: #334155; 
            color: #fff; 
            font-size: 1rem; 
            outline: none;
        }
        input:focus {
            border-color: #38bdf8;
        }
        button { 
            background: #38bdf8; 
            color: #0f172a; 
            font-size: 1rem;
            font-weight: 700; 
            cursor: pointer; 
            border: none; 
            margin-top: 12px; 
            margin-bottom: 12px; 
            transition: background 0.2s ease;
        }
        button:hover {
            background: #0ea5e9;
        }
        .status { 
            font-size: 0.85rem; 
            text-align: center; 
            color: #f59e0b; 
            min-height: 20px; 
            margin-bottom: 8px;
        }
        .output-box {
            margin-top: 20px; 
            background: #0f172a; 
            border: 1px solid #334155; 
            border-radius: 8px; 
            padding: 16px;
        }
        .res { 
            text-align: center; 
            font-size: 2.25rem; 
            color: #38bdf8; 
            font-weight: 800; 
            margin-top: 4px; 
        }
        .sub { 
            text-align: center; 
            color: #94a3b8; 
            font-size: 0.85rem; 
            margin-top: 4px; 
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Density Altitude Calculator</h2>
    
    <label for="icao">Airport ICAO Identifier</label>
    <input type="text" id="icao" value="" placeholder="Type 3 or 4 letter code (e.g. KVRB)" style="text-transform: uppercase;">
    <button onclick="getMetar()">Fetch Live Weather</button>

    <div class="status" id="status-msg">Enter an airport code above</div>

    <div style="display: flex; gap: 10px;">
        <div style="flex:1;">
            <label for="elev">Elev (ft)</label>
            <input type="number" id="elev" value="0" oninput="recalc()">
        </div>
        <div style="flex:1;">
            <label for="altim">Altimeter</label>
            <input type="number" id="altim" value="29.92" step="0.01" oninput="recalc()">
        </div>
        <div style="flex:1;">
            <label for="oat">OAT (°C)</label>
            <input type="number" id="oat" value="15" oninput="recalc()">
        </div>
    </div>

    <div class="output-box">
        <div class="sub">CALCULATED DENSITY ALTITUDE</div>
        <div class="res" id="da">-- ft</div>
        <div class="sub" id="pa">Pressure Altitude: -- ft</div>
        <div class="sub" id="isa-dev">ISA Dev: -- °C</div>
    </div>
</div>

<script>
    async function getMetar() {
        let code = document.getElementById('icao').value.trim().toUpperCase();
        const status = document.getElementById('status-msg');

        if (!code) {
            status.textContent = "Please enter an airport ICAO code first.";
            return;
        }

        // Auto-prefix 3-letter US codes with 'K'
        if (code.length === 3) {
            code = 'K' + code;
            document.getElementById('icao').value = code;
        }

        status.textContent = `Fetching live METAR for ${code}...`;
        status.style.color = "#f59e0b";

        try {
            // HTTPS CORS proxy call to NOAA API
            const targetUrl = `https://aviationweather.gov/api/data/metar?ids=${code}&format=json`;
            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
            
            const response = await fetch(proxyUrl);
            
            if (!response.ok) throw new Error("HTTP " + response.status);

            const data = await response.json();

            if (data && data.length > 0) {
                let r = data[0];
                
                if (r.temp !== undefined) document.getElementById('oat').value = r.temp;
                if (r.altim !== undefined) document.getElementById('altim').value = (r.altim * 0.02953).toFixed(2);
                if (r.elev !== undefined && r.elev !== null) document.getElementById('elev').value = r.elev;
                
                status.textContent = `Live METAR loaded for ${code}!`;
                status.style.color = "#10b981";
                recalc();
            } else {
                status.textContent = `No weather data available for "${code}".`;
                status.style.color = "#ef4444";
            }
        } catch (err) {
            console.error(err);
            status.textContent = "Failed to fetch weather data. Check code or entry.";
            status.style.color = "#ef4444";
        }
    }

    function recalc() {
        let elev = parseFloat(document.getElementById('elev').value) || 0;
        let altim = parseFloat(document.getElementById('altim').value) || 29.92;
        let oat = parseFloat(document.getElementById('oat').value) || 0;

        let pa = elev + ((29.92 - altim) * 1000);
        let isaTemp = 15 - ((pa / 1000) * 2);
        let isaDev = oat - isaTemp;
        let da = pa + (120 * isaDev);

        document.getElementById('da').textContent = `${Math.round(da).toLocaleString()} ft`;
        document.getElementById('pa').textContent = `Pressure Altitude: ${Math.round(pa).toLocaleString()} ft`;
        document.getElementById('isa-dev').textContent = `ISA Dev: ${isaDev >= 0 ? '+' : ''}${isaDev.toFixed(1)} °C`;
    }

    // Initial calculation setup
    recalc();
</script>

</body>
</html>
